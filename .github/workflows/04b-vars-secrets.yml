name: 04b vars and secrets

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: A variable prints normally
        run: echo "Region is ${{ vars.LAB_REGION }}"

      - name: A secret gets masked
        run: echo "Token is ${{ secrets.LAB_FAKE_TOKEN }}"

      - name: A secret that does not exist
        run: echo "Missing is '${{ secrets.DOES_NOT_EXIST }}'"
