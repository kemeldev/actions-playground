name: 04 contexts

on:
  workflow_dispatch:

env:
  GREETING: "hello from workflow-level env"

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB_LEVEL: "hello from job-level env"
    steps:
      - name: Dump the github context
        run: echo "$CONTEXT_JSON" | head -60
        env:
          CONTEXT_JSON: ${{ toJSON(github) }}

      - name: Dump the runner context
        run: echo '${{ toJSON(runner) }}'

      - name: Environment variables, three ways
        env:
          STEP_LEVEL: "hello from step-level env"
        run: |
          echo "workflow : $GREETING"
          echo "job      : $JOB_LEVEL"
          echo "step     : $STEP_LEVEL"
          echo "built-in : $GITHUB_REPOSITORY / run $GITHUB_RUN_ID"

      - name: Expressions are evaluated BEFORE the shell runs
        run: |
          echo "This branch is ${{ github.ref_name }}"
          echo "Is it main? ${{ github.ref_name == 'main' }}"
          echo "Run attempt ${{ github.run_attempt }} of run ${{ github.run_number }}"